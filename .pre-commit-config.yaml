repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # SCOPED TO CHANGED FILES (was repo-wide `mypy swarm/`). Repo-wide +
        # pass_filenames:false meant ANY session's broken or WIP file blocked
        # EVERY session's commits — a shared-checkout outage that fired
        # repeatedly (gepa WIP, nacl/gql cache crashes; coordination bead
        # 2026-07-22). Pre-commit is now fast local feedback on the files YOU
        # touch; the CI `type-check` job keeps the exhaustive full-tree mypy
        # that catches cross-file regressions, so nothing is lost as a gate.
        # --follow-imports=silent resolves imported types without reporting
        # another session's errors in files you didn't change.
        # gql + pynacl pinned so bridge/identity import graphs resolve the
        # same way every run (avoids the incremental-cache AssertionError
        # crash class, beads el65). Recovery if cache still corrupts: rm -rf .mypy_cache
        additional_dependencies: [numpy>=1.24, pydantic>=2.0, types-PyYAML, types-requests, "gql[aiohttp,websockets]>=3.5.0", pynacl>=1.5]
        args: [--ignore-missing-imports, --follow-imports=silent]
        files: ^swarm/.*\.py$
