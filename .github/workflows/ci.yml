name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check swarm/ tests/

  invariants:
    # INVARIANTS.md must map every declared invariant to a pytest node that
    # collects — an invariant without a running test is prose, not an
    # invariant. See scripts/check_invariants.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Mirror the test job's extras: the checker collects the referenced
      # test nodes, so it needs every import those tests pull in (analysis
      # brings matplotlib for governance_arena — first run failed without it).
      - run: python -m pip install -e ".[dev,runtime,api,analysis,gamescape]"
      - run: python scripts/check_invariants.py

  kb-graph-check:
    # Fails on (a) any orphan page (no inbound links) not in .kb-graph-orphans,
    # or (b) any stale reference — a broken mkdocstrings code directive or a
    # dead internal markdown link — not in .kb-graph-stale. Keeps the knowledge
    # graph from regressing as the docs corpus grows. Ratchet both baselines
    # down with:
    #   python scripts/build_kb_graph.py --update-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/build_kb_graph.py --check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,runtime]"
      - run: mypy swarm/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            mode: compatibility
          - python-version: "3.11"
            mode: compatibility
          - python-version: "3.12"
            mode: full
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,runtime,api,analysis,gamescape]"
      - run: echo "Running pytest in ${{ matrix.mode }} mode on Python ${{ matrix.python-version }}."
      - name: Download testmon data (best effort)
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: ci.yml
          branch: main
          name: testmondata-latest
          path: .testmon_cache
          if_no_artifact_found: ignore
      - name: Record testmon metadata (no coverage)
        if: github.ref == 'refs/heads/main' && matrix.mode == 'full'
        run: python scripts/test_changes.py --full -- pytest tests/ -v -n auto --dist=loadfile --timeout=300 --timeout-method=thread --durations=20 --durations-min=1.0 -p no:pytest_cov -m "not perf"
      - name: Ensure testmon data exists
        if: github.ref == 'refs/heads/main' && matrix.mode == 'full'
        run: test -f .testmondata
      - name: Run compatibility smoke tests
        if: matrix.mode == 'compatibility'
        run: python scripts/test_changes.py -- pytest tests/ -v -n auto --dist=loadfile --timeout=300 --timeout-method=thread --durations=20 --durations-min=1.0 -p no:pytest_cov -m "not perf"
      - name: Run full tests with coverage
        if: matrix.mode == 'full'
        run: pytest tests/ -v -n auto --dist=loadfile --timeout=300 --timeout-method=thread --durations=20 --durations-min=1.0 --cov=swarm --cov-report=term-missing --cov-fail-under=70 -p no:testmon -m "not perf"
      # Wall-clock budget tests run serially and without coverage: the coverage
      # tracer and xdist parallelism inflate timing 5-20×, causing false failures
      # unrelated to real regressions. See the `perf` marker in pyproject.toml.
      - name: Run performance budgets (serial, no coverage)
        if: matrix.mode == 'full'
        run: pytest tests/test_performance.py -v --timeout=300 -p no:testmon -p no:pytest_cov -p no:xdist -m perf
      - name: Upload testmon data
        if: success() && matrix.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: testmondata-${{ github.sha }}
          path: .testmondata
          if-no-files-found: ignore
      - name: Upload testmon data (latest)
        if: success() && github.ref == 'refs/heads/main' && matrix.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: testmondata-latest
          path: .testmondata
          if-no-files-found: ignore

  # Enforce the CI-owned AgentGit policy (.github/agentgit.policy.yaml) against
  # every provenance bundle committed under .agentgit/. Bundles record what an
  # agent actually did (signed diff facts); the gate judges those facts against
  # the org policy, independent of whatever policy the agent self-attested
  # with. No committed bundles -> pass (most PRs are human/local-session work).
  # The pytest result is CI-authoritative: it comes from the `test` job, never
  # from the bundle's self-attested checks. Fails closed on a missing
  # AGENTGIT_SIGNING_KEY secret or an unverifiable bundle.
  agentgit-gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Gate committed provenance bundles
        env:
          AGENTGIT_SIGNING_KEY: ${{ secrets.AGENTGIT_SIGNING_KEY }}
          PYTEST_RESULT: ${{ needs.test.result }}
        run: |
          bundles=$(git ls-files '.agentgit/*.json' '.agentgit/**/*.json')
          if [ -z "$bundles" ]; then
            echo "no committed provenance bundles to gate"
            exit 0
          fi
          check="fail"
          [ "$PYTEST_RESULT" = "success" ] && check="pass"
          rc=0
          for bundle in $bundles; do
            python -m swarm.agentgit gate \
              --bundle "$bundle" \
              --policy .github/agentgit.policy.yaml \
              --check "pytest=$check" || rc=1
          done
          exit $rc

  # Render-verify JS-bearing docs pages: build the static site, serve it, and
  # confirm the dashboards actually render in a headless browser. HTTP 200 is
  # not proof a page works — curl/WebFetch don't run JS. This gate would have
  # caught the May-2026 runaway-canvas bug that blanked the Gitlawb dashboard.
  render-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git-revision-date-localized resolves accurate
          # "last updated" dates instead of falling back to the build date.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image libs for mkdocs-material social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
      - name: Install docs build deps
        run: |
          python -m pip install \
            "mkdocs-material[imaging]" \
            "mkdocstrings[python]" \
            pymdown-extensions \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-rss-plugin
      - name: Build static site
        # --strict gates on broken internal links and nav regressions. The
        # git-revision-date plugin's git-history warnings are decoupled via its
        # own `strict: false` (see mkdocs.yml), so only real link/nav breakage
        # fails the build. The committed docs/bridges/gitlawb_snapshot.json is
        # copied into site/, so the dashboard's same-origin backfill works
        # without network access.
        run: mkdocs build --strict
      - name: Serve built site
        run: |
          python -m http.server 8000 --directory site &> /tmp/http.log &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          google-chrome --version || true
      - name: Render-verify JS dashboards
        run: |
          scripts/render-verify.sh "http://localhost:8000/bridges/gitlawb/" \
            --id-nonempty gl-count \
            --expect-text "Quality Distribution" \
            --screenshot /tmp/gitlawb.png
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-verify-screenshots
          path: /tmp/*.png
          if-no-files-found: ignore

  # Single required status check that gates PR merges.
  # Add "quality-gate" as a required check in GitHub branch protection.
  quality-gate:
    if: always()
    needs: [lint, invariants, kb-graph-check, type-check, test, agentgit-gate, render-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [[ "${{ needs.invariants.result }}" != "success" ]]; then
            echo "::error::Invariant manifest check failed (INVARIANTS.md maps an invariant to no test, or a referenced test no longer collects)"
            exit 1
          fi
          if [[ "${{ needs.kb-graph-check.result }}" != "success" ]]; then
            echo "::error::kb-graph ratchet failed (new orphan pages vs .kb-graph-orphans, or new stale refs vs .kb-graph-stale)"
            exit 1
          fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "::error::Type check failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [[ "${{ needs.agentgit-gate.result }}" != "success" ]]; then
            echo "::error::AgentGit gate failed (a committed provenance bundle violates .github/agentgit.policy.yaml)"
            exit 1
          fi
          if [[ "${{ needs.render-verify.result }}" != "success" ]]; then
            echo "::error::Render-verify failed (a JS docs page is broken)"
            exit 1
          fi
          echo "All quality gates passed"

  # Direct pushes to main bypass the branch-protection gate by design
  # (parallel multi-session merges — see project memory: strict checks
  # intentionally off). This job is the compensating control: a red main
  # becomes a GitHub issue within minutes instead of a silently ignored
  # red X on the commit list. Closes the loop that made the gate
  # ignorable (beads k8am).
  alert-main-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 8);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "CI red on main";
            const body = `Quality gate failed on direct push \`${sha}\`.\n\n` +
              `Run: ${runUrl}\n\n` +
              `Direct pushes bypass the PR gate by design; this issue is the ` +
              `pager. Fix or revert, then close. (beads k8am)`;
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: "ci-red-main", color: "b60205",
                description: "Quality gate failed on a direct push to main",
              });
            } catch (e) { /* 422 = already exists */ }
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-red-main",
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Still red at \`${sha}\`: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ci-red-main"],
              });
            }
