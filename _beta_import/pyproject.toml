[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-swarm"
version = "0.1.0"
description = "Distributional safety: a Beta belief over a continuous outcome, generalizing scalar soft labels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raeli Savitt" }]
keywords = ["ai-safety", "multi-agent", "distributional", "bayesian", "governance"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["beta_swarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
