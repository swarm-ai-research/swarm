[build-system]
requires = ["setuptools>=61.0,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-safety"
version = "1.9.0"
description = "SWARM: System-Wide Assessment of Risk in Multi-agent systems - A Distributional AGI Safety framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raeli Savitt"}
]
keywords = ["multi-agent", "ai-safety", "distributional-safety", "swarm", "emergence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "pytest-socket>=0.7",
    "mypy",
    "types-PyYAML",
    "ruff",
    "memory_profiler>=0.61.0",
    "psutil>=5.9.0",
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
runtime = [
    "requests>=2.31",
    "tenacity>=8.2",
    # The worktree bridge CLI (swarm/bridges/worktree/__main__.py) imports rich
    # unconditionally and the agentgit attest loop drives it as a subprocess.
    "rich>=13.0",
]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
]
llama_cpp = [
    "llama-cpp-python>=0.3.0",
    "openai>=1.50.0",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.0",
]
bridges = [
    "swarm-gastown",
]
docker = [
    "docker>=7.0.0",
]
cli = [
    "rich>=13.0",
]
concordia = [
    "concordia>=1.0",
]
crewai = [
    "crewai>=0.80.0,<2.0",
]
avp = [
    "agentveil>=0.1",
]
awm = [
    "httpx>=0.27.0",
]
letta = [
    "letta-client>=0.16.0",
]
memori = [
    "memori>=3.0.0",
]
hodoscope = [
    "hodoscope",
]
rag = [
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
]
rag-leann = [
    "leann>=0.1.0",
    "langchain-text-splitters>=0.2.0",
]
gamescape = [
    "gamescape",
]
langgraph = [
    "langgraph==1.2.5",
    "langchain-core==1.4.8",
    "langchain-anthropic==1.4.7",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
]
# NOTE: darwinian-evolver is GitHub-only (not on PyPI). PyPI rejects direct
# URL dependencies in published metadata (PEP 508 direct refs), so it cannot be
# declared here. Install it alongside this extra when you need the evolve bridge:
#   pip install "swarm-safety[evolve]" \
#     "darwinian-evolver @ git+https://github.com/imbue-ai/darwinian_evolver.git"
evolve = []
gepa = [
    "gepa>=0.1.0",
]
prime_intellect = [
    "prime>=0.1.0",
    "verifiers>=0.1.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
]
gitlawb = [
    "gql[aiohttp,websockets]>=3.5.0",
]
all = [
    "swarm-safety[dev,analysis,runtime,llm,dashboard,docs,api,cli,gitlawb]",
]

[project.urls]
Homepage = "https://swarm-ai.org"
Documentation = "https://docs.swarm-ai.org"
Repository = "https://github.com/swarm-ai-research/swarm"
Issues = "https://github.com/swarm-ai-research/swarm/issues"

[project.scripts]
swarm = "swarm.__main__:main"
agentgit = "swarm.agentgit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm*", "swarm_gym*"]

[tool.setuptools.package-data]
swarm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
norecursedirs = [
    ".hypothesis",
    ".pytest_cache",
    "__pycache__",
    ".git",
    ".testmon_cache",
    ".venv",
    "external",
    "htmlcov",
    "runs",
    "site",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark a test as an async test (used by pytest-asyncio)",
    "slow: mark test as slow running (deselect with '-m \"not slow\"')",
    "memory: mark test as memory-focused (runs with memory limits)",
    "memory_intensive: mark test as long-running memory test (>1000 epochs)",
    "perf: mark wall-clock performance budget test (run serially without coverage; tracer/xdist distort timing)",
]

[tool.mypy]
# Must be >= 3.12: numpy's stubs use PEP 695 `type` statements, which mypy
# rejects as syntax errors when emulating an older target version. CI runs on
# 3.12, so check against it. Runtime support floor stays at 3.10 (requires-python).
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "swarm.core.orchestrator"
warn_return_any = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.coverage.run]
source = ["swarm"]
branch = true
omit = [
    "swarm/analysis/streamlit_app.py",
    "swarm/bridges/worktree/__main__.py",
    "swarm/api/flask_app.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]
