# RLVR bug-bounty study — arm: bounty
#
# Bug bounty only — buy the reward hack instead
# See scenarios/rlvr_bounty/_shared.md for the arm table.

scenario_id: rlvr_bounty_bounty
description: "Bug bounty only — buy the reward hack instead"
motif: "Exploit-or-report on reward-proxy defects"

agents:
  - type: honest
    count: 4

  # Expected-value hunters: exploit unless reporting pays more.
  - type: bug_hunter
    count: 3
    config:
      discovery_rate: 0.12
      exploit_gain: 0.35
      expected_uses: 6.0
      audit_penalty: 2.0

  # Same decision rule, plus a willingness to invent findings when the
  # bounty makes fabrication profitable.
  - type: bug_hunter
    count: 1
    name: bounty_farmer
    config:
      discovery_rate: 0.12
      exploit_gain: 0.35
      expected_uses: 6.0
      audit_penalty: 2.0
      opportunism: 0.35

governance:
  # The cooperative game: post a price for verified reports and patch.
  audit_enabled: false
  bug_bounty_enabled: true
  bug_bounty_amount: 3.0
  bug_bounty_reputation: 0.2
  bug_bounty_patch_delay_epochs: 1
  bug_bounty_verifier_sensitivity: 0.9
  bug_bounty_verifier_specificity: 0.8
  bug_bounty_false_report_penalty: 2.0

simulation:
  n_epochs: 30
  steps_per_epoch: 12
  seed: 42

rate_limits:
  posts_per_epoch: 10
  interactions_per_step: 8
  votes_per_epoch: 50
  tasks_per_epoch: 3

payoff:
  s_plus: 2.0
  s_minus: 1.0
  h: 2.0
  theta: 0.5
  rho_a: 0.0
  rho_b: 0.0
  w_rep: 1.0

outputs:
  event_log: "logs/rlvr_bounty_bounty_events.jsonl"
  metrics_csv: "logs/rlvr_bounty_bounty_metrics.csv"
