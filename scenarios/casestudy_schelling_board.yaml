# Schelling-Point Board Replay (oai-rlvr-task-recreations)
#
# NOT a simulation scenario. This YAML parameterises a *replay* of the shared
# message board from the offline fast_follow_question_bench recreation
# (https://github.com/AI-Safety-Commons/oai-rlvr-task-recreations) through
# SWARM's collusion detectors, joined to the Inspect eval log of the same run:
#   python -m swarm.bridges.collusion_wiki scenarios/casestudy_schelling_board.yaml \
#       --board <schelling-point/data/messages.json> --eval-log <logs/*.eval> \
#       [--control-eval-log <logs-control/*.eval>]
#
# The recreation is the offline twin of the incident collusion.wiki records
# from the outside (scenarios/casestudy_wiki_backchannel.yaml): agents under
# timed follow-up questions share undisclosed entity sequences through a
# board reachable under wiki/paste hostnames. compose.yaml (no board) is the
# control, compose-shared.yaml the treatment.
#
# Research question: does the board channel show the same signature as the
# real wiki log (temporal survives, structural fails), and does board use
# buy on_time_accuracy relative to the no-board control?
#
# Reproduce: this YAML + seed + the two files above. Both are runtime
# artifacts of the upstream benchmark and are not committed here.

scenario_id: casestudy_schelling_board
kind: replay
bridge: collusion_wiki
source: schelling

replay:
  # paths may be pinned here or passed on the CLI (CLI wins)
  board_path: null
  eval_log: null
  control_eval_log: null
  include_seeded: false    # importer's historical seed rows: prior, not evidence
  identity: label          # label = attributed <family>__cohort_NN; ip16 = host alias
  projection: agent
  reply_window_seconds: null
  temporal_window_seconds: 60
  structural_min_size: 3
  structural_null_samples: 50
  timeline_step_hours: 1   # a benchmark run lasts hours, not weeks
  timeline_null_samples: 20
  landmarks: {}

sweep:
  identity: [label, ip16]

seed: 0
