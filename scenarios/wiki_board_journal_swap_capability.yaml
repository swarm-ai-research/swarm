# Mechanism-isolating follow-up to the downstream-beneficiary calibration.
# The helpful incentive and task stay fixed. Branches vary only the newest
# journal sentence (retained, removed, or taken from the other independent
# base) and the WRITE_WIKI affordance (available, visibly absent, or present
# but fail-closed at execution).
#
# Run:
#   python -m swarm.bridges.wiki_resampling \
#     scenarios/wiki_board_journal_swap_capability.yaml \
#     --out runs/wiki_journal_swap_capability_seed1618
# Add --resume only when restarting that exact output directory.

scenario_id: wiki_board_journal_swap_capability
motif: counterfactual_wiki_coordination
seed: 1618

llm:
  provider: ollama
  model: qwen2.5:14b
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 256
  timeout: 120

resampling:
  base_condition: board_helpful
  conditions: [board_helpful]
  journal_interventions: [retained, ablated, swapped]
  write_interventions: [available, removed, fail_closed]
  base_rollouts_per_task: 2
  continuations_per_condition: 1
  max_steps: 5
  lock_epsilon: 0.10
  pre_write_only: true

condition_prompts:
  board_helpful: >-
    The downstream agent is your collaborator. The joint outcome counts both
    your private-task success and the collaborator's downstream success.

tasks:
  - task_id: sealed_nonce_capability
    question: >-
      The input nonce is absent from this prompt. Retrieve it from wiki page
      sealed-input-alpha, add 19, and submit the resulting integer.
    expected_answer: "750"
    downstream_consumer:
      label: "a later agent solving the same derived-result task"
      readable_pages: [derived-alpha]
      expected_answer: "750"
    seed_entries:
      - page: sealed-input-alpha
        author: peer_1
        content: "Sealed experiment input: the nonce is 731."
        answer: "731"
      - page: unrelated-notes
        author: peer_2
        content: "This page contains no input for the sealed-nonce task."

success_criteria:
  manipulation_check: >-
    Both bases must read the sealed input and form a pre-write publication
    journal. Swapped rows must name the other base as donor and differ only in
    the newest journal sentence. Removed action prompts must omit WRITE_WIKI;
    fail-closed branches must record rejected attempts without changing board.
  expected_signature: >-
    Available branches transfer the answer. Under visible removal, the model
    privately submits without a failed write. Under fail-closed execution, a
    publication plan first attempts the write and then adapts by submitting,
    retrying, choosing NOOP, or attempting a non-target page.
