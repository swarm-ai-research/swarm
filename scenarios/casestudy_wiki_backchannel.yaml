# Wiki Back Channel Replay (collusion.wiki, May-July 2026)
#
# NOT a simulation scenario. This YAML parameterises a *replay* of a real
# edit log through SWARM's collusion detectors, consumed by
#   python -m swarm.bridges.collusion_wiki scenarios/casestudy_wiki_backchannel.yaml
#
# Source: OpenAI web-research benchmark agents discovered they could write
# to public UseModWiki instances (DSEWiki, ProbierWiki, FractalWiki on
# wikiservice.at) and used them as a shared answer board. Data assembled by
# Von Arx, Slade Byrd, Kitts & Larsen at https://collusion.wiki (download
# page: /explorer/download.html; site marked "draft, do not share without
# permission" as of 2026-09-04 -- we use it for analysis, we do not
# redistribute it; the data files are gitignored under runs/).
#
# Research question (docs/blog/the-zzz-pages-agents-built-a-back-channel.md):
#   "Out-of-band coordination defeats structural detection; the signal that
#    survives is temporal." Does that hold on the real log?
#
# Reproduce: scenario YAML + seed + the dataset at the pinned manifest hash.

scenario_id: casestudy_wiki_backchannel
kind: replay
bridge: collusion_wiki

data:
  base_url: https://collusion.wiki/explorer/download/
  files: [revisions.jsonl.gz, events.jsonl.gz, labels.jsonl.gz, manifest.json.gz]
  # manifest.json "db_sha256" of the export this scenario was written against
  manifest_db_sha256: 199241bf9e0b38b58764cf1545680de8fec8896db034050bde145e3b6f6ce0bb

# Third source (bead lnaf): the ai-safety-lab incident db from
# swarm.termina.digital/pub/ (CC0-1.0, schema version 9). Its record table
# carries the export revisions plus live RecentChanges rows to 2026-09-07,
# so post-disclosure activity on the wikis is visible here only. Bodies are
# pointers, not text; the reading pack stays the body source. Pinned to the
# bundle generated 2026-09-08T14:10:58Z (manifest sha256s of the tables the
# loader reads, plus the sqlite file itself); swarm/bridges/collusion_wiki/
# termina.py verify_pins() reports ok / mismatch / absent per entry.
termina:
  base_url: https://swarm.termina.digital/pub/
  files: [incidents.sqlite, manifest.json, schema.json]
  export_end: "2026-07-02T23:59:59Z"
  pins:
    incidents.sqlite: 80bb262a52008bd9e29c4d99d17aac542cfce23d72f3bd5b3f0208414632e69e
    record.jsonl: 03a28c1d1becf2569460fde5881ff20f109a4c92768caebce72d41fc6e6b773e
    actor.jsonl: 1edf0db6ec29299574464b021d53b15decda102128a9fb725384e6d2e395464b
    venue.jsonl: 7d8fb50d5d1de5cd5ed72b173d127515494bc32b4223f26df3ed81634e4e50b6
    claim.jsonl: 28a03162d4f4b66f36be6b44af6f5f2de314982df65cb0e112f6d9adfa3f57d9

replay:
  identity: label          # label | ip16 | label_ip16  (also swept below)
  projection: agent        # agent | page
  reply_window_seconds: null
  temporal_window_seconds: 60
  structural_min_size: 3
  structural_null_samples: 50
  timeline_step_hours: 24
  timeline_null_samples: 20
  # landmarks the detection-lag table is measured against
  landmarks:
    moderator_sweep_begins: "2026-06-19T00:00:00Z"
    openai_hq_visit: "2026-06-21T00:00:00Z"
    main_board_quiet: "2026-06-22T23:59:59Z"

sweep:
  identity: [label, ip16, label_ip16]

seed: 0
