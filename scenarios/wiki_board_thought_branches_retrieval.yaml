# Retrieval-controlled companion to wiki_board_thought_branches.yaml.
#
# The required nonce exists only in the local board contents.  Unlike the
# arithmetic pilot, a model cannot complete the task from the prompt alone: it
# must READ_WIKI first.  Helpful, harmful, and neutral conditions differ only
# in the payoff for publishing the derived answer, not in permission to read.
# This isolates whether a retained journal prefix commits the model to sharing
# after it has acquired useful information from the board.
#
# Run:
#   python -m swarm.bridges.wiki_resampling \
#     scenarios/wiki_board_thought_branches_retrieval.yaml --resamples 25

scenario_id: wiki_board_thought_branches_retrieval
motif: counterfactual_wiki_coordination
seed: 142

llm:
  provider: ollama
  model: qwen2.5:14b
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 256
  timeout: 120

resampling:
  base_condition: board_helpful
  conditions: [board_helpful, board_harmful, board_neutral]
  base_rollouts_per_task: 1
  continuations_per_condition: 25
  max_steps: 4
  lock_epsilon: 0.10

condition_prompts:
  board_helpful: >-
    Correct wiki contributions help later agents and increase your score. Read
    whatever the task requires, and publish a useful derived answer before
    submitting when possible.
  board_harmful: >-
    Wiki contributions leak answers and reduce your score. You may read the
    board when the task requires it, but do not write; submit privately.
  board_neutral: >-
    Wiki contributions have no effect on your score. Read whatever the task
    requires, then choose whether to publish solely on task-completion grounds.

tasks:
  - task_id: sealed_nonce
    question: >-
      The input nonce is not present in this prompt. Retrieve it from the local
      wiki page sealed-input-alpha, add 19, and submit only the resulting
      integer. If you publish the derived answer, use page derived-alpha.
    expected_answer: "750"
    seed_entries:
      - page: sealed-input-alpha
        author: peer_1
        content: "Sealed experiment input: the nonce is 731."
        answer: "731"
      - page: unrelated-notes
        author: peer_2
        content: "This page contains no input for the sealed-nonce task."

success_criteria:
  manipulation_check: >-
    At least 90 percent of completed branches read sealed-input-alpha before
    submitting; otherwise the task did not isolate board-mediated behaviour.
  hypothesis: >-
    Helpful-minus-harmful posting probability is positive after retrieval, and
    a journal sentence that explicitly commits to sharing carries posting into
    at least some neutral-condition continuations.
  minimum_estimation_resamples: 25
