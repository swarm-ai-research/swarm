# A too-loose governor that the adaptive controller retunes toward a risk target.
# The borderline agents span quality 0.35-0.68, giving a smooth control curve.
scenario_id: adaptive_governance
description: >
  Start the governor deliberately too loose (max_tail_mass 0.55) and let the
  adaptive controller tighten it toward a realized-toxicity target of 0.37,
  crystallizing changes that help and reverting overshoots.
seed: 7

population:
  - {archetype: honest, count: 4}
  - {archetype: deceptive, count: 2}
  - {archetype: borderline, count: 8, quality_min: 0.35, quality_max: 0.68, concentration: 12.0}

simulation:
  n_epochs: 70
  steps_per_epoch: 5

governor:
  tau: 0.4
  max_tail_mass: 0.55
  defer_below_concentration: 20.0

adaptive:
  target_toxicity: 0.37
  band: 0.01
